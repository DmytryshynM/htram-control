<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTRAM Control & Monitor</title>
  <style>
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f9fafb;
      --subtext: #9ca3af;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container { max-width: 550px; width: 100%; }
    .header { text-align: center; margin-bottom: 20px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }
    .btn {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); }
    .btn:disabled { background: #4b5563; cursor: not-allowed; }
    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #6b7280; }
    .dot.connected { background: var(--success); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric { font-size: 32px; font-weight: 700; color: #60a5fa; margin-top: 8px; }
    label { display: block; font-size: 13px; color: var(--subtext); margin-bottom: 4px; }
    select {
      width: 100%; padding: 10px; border-radius: 6px;
      border: 1px solid #374151; background: #111827; color: white;
      font-size: 14px; box-sizing: border-box; margin-bottom: 12px;
    }
    .log-box {
      background: #0f172a; border-radius: 8px; padding: 10px;
      font-family: monospace; font-size: 12px; height: 120px;
      overflow-y: auto; color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>HTRAM Controller 🇺🇦</h2>
    <p style="color: var(--subtext);">Панель моніторингу та керування</p>
  </div>

  <div class="card">
    <div class="status">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Стан: Не підключено</span>
    </div>
    <button id="connectBtn" class="btn">Підключити HTRAM</button>
  </div>

  <div class="card grid">
    <div>
      <label>Рівень CO₂</label>
      <div id="co2Value" class="metric">-- ppm</div>
    </div>
    <div>
      <label>Статус Ризику</label>
      <div id="riskStatus" class="metric" style="color: var(--success); font-size: 22px; margin-top: 14px;">--</div>
    </div>
  </div>

  <div class="card">
    <h3>Частота оновлення інтерфейсу сайту</h3>
    <label for="filterInterval">Відображати нові дані на екрані:</label>
    <select id="filterInterval">
      <option value="0">В реальному часі (кожні 5 сек)</option>
      <option value="60">Раз на 1 хвилину</option>
      <option value="300">Раз на 5 хвилин</option>
      <option value="600" selected>Раз на 10 хвилин</option>
    </select>
  </div>

  <div class="card">
    <h3>Керування зумером</h3>
    <button id="muteBtn" class="btn btn-danger" disabled>Вимкнути / Увімкнути звук</button>
  </div>

  <div class="card">
    <h3>Системний лог</h3>
    <div id="log" class="log-box">Очікування дії...<br></div>
  </div>
</div>

<script>
  const SERVICE_UUID = 'fc247940-6e08-11e4-80fc-0002a5d5c51b';
  const WRITE_CHAR_UUID = '3d115840-6e0b-11e4-b24f-0002a5d5c51b';
  const READ_CHAR_UUID = 'f833d6c0-6e0b-11e4-9136-0002a5d5c51b';

  let writeChar = null;
  let isMuted = false;
  let lastUIUpdate = 0;

  function log(msg) {
    const logBox = document.getElementById('log');
    logBox.innerHTML += `> ${msg}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      log('Пошук пристрою HTRAM...');
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [SERVICE_UUID]
      });

      log(`Підключення до ${device.name}...`);
      const server = await device.gatt.connect();
      
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').innerText = 'Підключено: ' + device.name;

      const service = await server.getPrimaryService(SERVICE_UUID);
      writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);
      document.getElementById('muteBtn').disabled = false;

      // Підписка на стрімінг даних
      const readChar = await service.getCharacteristic(READ_CHAR_UUID);
      await readChar.startNotifications();
      readChar.addEventListener('characteristicvaluechanged', handleData);
      
      log('✅ Підключено успішно! Зчитування даних активовано.');

    } catch (err) {
      log(`❌ Помилка: ${err.message}`);
    }
  });

  // Універсальний парсер байтів CO2
  function handleData(event) {
    const value = event.target.value;
    const now = Date.now();
    const intervalMs = parseInt(document.getElementById('filterInterval').value) * 1000;

    // Перевірка часового фільтра для інтерфейсу
    if (intervalMs > 0 && (now - lastUIUpdate) < intervalMs) {
      return; 
    }

    let co2 = 0;
    // Парсинг байтового масиву
    for (let i = 0; i < value.byteLength - 1; i++) {
      let val = value.getUint16(i, false); // Big-Endian
      if (val >= 400 && val <= 5000) {
        co2 = val;
        break;
      }
    }

    if (co2 > 0) {
      lastUIUpdate = now;
      document.getElementById('co2Value').innerText = `${co2} ppm`;
      
      const riskElem = document.getElementById('riskStatus');
      if (co2 < 800) {
        riskElem.innerText = 'Низький';
        riskElem.style.color = '#16a34a';
      } else if (co2 >= 800 && co2 < 1100) {
        riskElem.innerText = 'Середній';
        riskElem.style.color = '#d97706';
      } else {
        riskElem.innerText = 'Високий';
        riskElem.style.color = '#dc2626';
      }
      log(`Отримано показник: ${co2} ppm`);
    }
  }

  // Керування зумером
  document.getElementById('muteBtn').addEventListener('click', async () => {
    if (!writeChar) return;
    try {
      isMuted = !isMuted;
      const val = isMuted ? 0x00 : 0x01;
      const command = new Uint8Array([0x02, val, 0x00]);
      await writeChar.writeValue(command);
      log(`✅ Команда звуку відправлена: ${isMuted ? 'Mute' : 'Unmute'}`);
    } catch (err) {
      log(`❌ Помилка звуку: ${err.message}`);
    }
  });
</script>

</body>
</html>
