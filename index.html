<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTRAM Stable Controller</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --subtext: #94a3b8;
      --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; 
      --warning: #f59e0b; --success: #10b981; --purple: #8b5cf6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text); margin: 0; padding: 15px;
      display: flex; justify-content: center;
    }
    .container { max-width: 550px; width: 100%; }
    .header { text-align: center; margin-bottom: 20px; }
    .card {
      background: var(--card); border-radius: 12px; padding: 20px;
      margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
      font-size: 14px; transition: 0.2s; margin-top: 8px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-purple { background: var(--purple); }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: bold; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #64748b; }
    .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric { font-size: 34px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
    label { display: block; font-size: 13px; color: var(--subtext); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155;
      background: #0f172a; color: white; font-size: 14px; box-sizing: border-box;
    }
    .log-box {
      background: #020617; border-radius: 8px; padding: 10px; font-family: monospace;
      font-size: 11px; height: 130px; overflow-y: auto; color: #cbd5e1;
    }
    .raw-data {
      background: #020617; border-radius: 6px; padding: 10px;
      font-family: monospace; font-size: 13px; color: #10b981; word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin-bottom: 5px;">HTRAM Stable Panel 🇺🇦</h2>
    <p style="color: var(--subtext); margin-top: 0; font-size: 14px;">Стабільна версія (Фіксовані канали)</p>
  </div>

  <div class="card">
    <div class="status">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Стан: Не підключено</span>
    </div>
    <button id="connectBtn" class="btn">📡 Підключити HTRAM</button>
  </div>

  <div class="card grid">
    <div>
      <label>Рівень CO₂</label>
      <div id="co2Value" class="metric">-- ppm</div>
    </div>
    <div>
      <label>Статус Ризику</label>
      <div id="riskStatus" class="metric" style="color: var(--success); font-size: 22px; margin-top: 15px;">--</div>
    </div>
  </div>

  <div class="card">
    <h3>Радар даних (Raw BLE Payload)</h3>
    <div id="rawPayload" class="raw-data">Очікування підключення...</div>
  </div>

  <div class="card">
    <h3>1. Керування апаратурою</h3>
    <div class="grid">
      <button id="muteOnBtn" class="btn btn-danger" disabled>🔇 Вимкнути звук</button>
      <button id="muteOffBtn" class="btn btn-success" disabled>🔊 Увімкнути звук</button>
      
      <button id="displayOffBtn" class="btn btn-warning" disabled>💡 Вимкнути дисплей</button>
      <button id="displayOnBtn" class="btn btn-success" disabled>💡 Увімкнути дисплей</button>

      <button id="tempFBtn" class="btn btn-purple" disabled>🌡 Фаренгейт (°F)</button>
      <button id="tempCBtn" class="btn btn-purple" disabled>🌡 Цельсій (°C)</button>
    </div>
  </div>

  <div class="card">
    <h3>2. Профіль приміщення (Activity Level)</h3>
    <select id="profileSelect" disabled>
      <option value="0">Низька активність (Офіс / Дім: 800-1100 ppm)</option>
      <option value="1">Середня активність (Школа: 1000-1400 ppm)</option>
      <option value="2">Висока активність (Спортзал: 1200-1600 ppm)</option>
    </select>
    <button id="setProfileBtn" class="btn" disabled>Застосувати профіль</button>
  </div>

  <div class="card">
    <h3>3. Власні пороги (Custom Thresholds)</h3>
    <div class="grid">
      <div>
        <label>Жовтий рівень (ppm):</label>
        <input type="number" id="yellowLimit" value="800" min="400" disabled>
      </div>
      <div>
        <label>Червоний рівень (ppm):</label>
        <input type="number" id="redLimit" value="1100" min="600" disabled>
      </div>
    </div>
    <button id="setLimitsBtn" class="btn" disabled>Записати пороги</button>
  </div>

  <div class="card">
    <h3>Системний лог</h3>
    <div id="log" class="log-box">Готово до роботи.<br></div>
  </div>
</div>

<script>
  window.onerror = function(msg, url, line) { log(`🔴 JS Помилка: ${msg}`); return false; };
  
  const SERVICE_UUID = 'fc247940-6e08-11e4-80fc-0002a5d5c51b';
  const WRITE_CHAR_UUID = '3d115840-6e0b-11e4-b24f-0002a5d5c51b';
  const READ_CHAR_UUID = 'f833d6c0-6e0b-11e4-9136-0002a5d5c51b';
  
  let writeChar = null;

  function log(msg) {
    const logBox = document.getElementById('log');
    if(!logBox) return;
    const time = new Date().toLocaleTimeString();
    logBox.innerHTML += `[${time}] ${msg}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  async function sendCommand(name, hexArray) {
    if (!writeChar) { log('❌ Канал запису не підключено!'); return; }
    try {
      const data = new Uint8Array(hexArray);
      // Спочатку пробуємо стандартний запис, якщо пристрій не підтримує - запис без відповіді
      try {
        await writeChar.writeValue(data);
      } catch (e) {
        await writeChar.writeValueWithoutResponse(data);
      }
      log(`✅ Команда [${name}] надіслана успішно.`);
    } catch (err) {
      log(`❌ Помилка [${name}]: ${err.message}`);
    }
  }

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      log('Пошук пристрою HTRAM...');
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'HTRAM' }],
        optionalServices: [SERVICE_UUID]
      });

      log(`Підключення до ${device.name}...`);
      const server = await device.gatt.connect();
      
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').innerText = 'Підключено: ' + device.name;

      const service = await server.getPrimaryService(SERVICE_UUID);
      log('✅ Сервіс знайдено. Підключення до каналів...');

      // ЖОРСТКА прив'язка до правильних каналів (без автопошуку)
      writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);
      log(`✅ Канал керування підключено: ${WRITE_CHAR_UUID.split('-')[0]}`);

      const readChar = await service.getCharacteristic(READ_CHAR_UUID);
      await readChar.startNotifications();
      readChar.addEventListener('characteristicvaluechanged', handleData);
      log(`✅ Канал даних підключено: ${READ_CHAR_UUID.split('-')[0]}`);

      // Розблокування кнопок
      const controls = [
        'muteOnBtn', 'muteOffBtn', 'displayOffBtn', 'displayOnBtn', 
        'tempFBtn', 'tempCBtn', 'profileSelect', 'setProfileBtn', 
        'yellowLimit', 'redLimit', 'setLimitsBtn'
      ];
      controls.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.disabled = false;
      });

    } catch (err) {
      log(`❌ Помилка з'єднання: ${err.message}`);
    }
  });

  // Універсальний парсер даних (БЕЗ ФІЛЬТРІВ)
  function handleData(event) {
    try {
      const value = event.target.value;
      if (!value || value.byteLength < 2) return;
      
      let hexArr = [];
      for (let i = 0; i < value.byteLength; i++) {
        hexArr.push(value.getUint8(i).toString(16).padStart(2, '0').toUpperCase());
      }
      document.getElementById('rawPayload').innerText = hexArr.join(' ');
      
      let co2 = 0;
      for (let i = 0; i < value.byteLength - 1; i++) {
        let valBE = value.getUint16(i, false);
        let valLE = value.getUint16(i, true);
        
        if (valBE >= 400 && valBE <= 10000) { co2 = valBE; break; }
        if (valLE >= 400 && valLE <= 10000) { co2 = valLE; break; }
      }

      if (co2 > 0) {
        document.getElementById('co2Value').innerText = `${co2} ppm`;
        
        const riskElem = document.getElementById('riskStatus');
        const yellow = parseInt(document.getElementById('yellowLimit').value) || 800;
        const red = parseInt(document.getElementById('redLimit').value) || 1100;

        if (co2 < yellow) {
          riskElem.innerText = 'Низький'; riskElem.style.color = '#10b981';
        } else if (co2 >= yellow && co2 < red) {
          riskElem.innerText = 'Середній'; riskElem.style.color = '#f59e0b';
        } else {
          riskElem.innerText = 'Високий'; riskElem.style.color = '#ef4444';
        }
      }
    } catch(err) {
      log(`❌ Помилка парсингу: ${err.message}`);
    }
  }

  // Прив'язка кнопок (додано 3-й нульовий байт для сумісності пакетів)
  document.getElementById('muteOnBtn').onclick = () => sendCommand('Зумер Вимк', [0x02, 0x01, 0x00]);
  document.getElementById('muteOffBtn').onclick = () => sendCommand('Зумер Увімк', [0x02, 0x00, 0x00]);
  
  document.getElementById('displayOffBtn').onclick = () => sendCommand('Дисплей Вимк', [0x05, 0x00, 0x00]);
  document.getElementById('displayOnBtn').onclick = () => sendCommand('Дисплей Увімк', [0x05, 0x01, 0x00]);
  
  document.getElementById('tempFBtn').onclick = () => sendCommand('Темп °F', [0x06, 0x01, 0x00]);
  document.getElementById('tempCBtn').onclick = () => sendCommand('Темп °C', [0x06, 0x00, 0x00]);

  document.getElementById('setProfileBtn').onclick = () => {
    const prof = parseInt(document.getElementById('profileSelect').value);
    sendCommand('Профіль', [0x03, prof, 0x00]);
  };

  document.getElementById('setLimitsBtn').onclick = () => {
    const y = parseInt(document.getElementById('yellowLimit').value);
    const r = parseInt(document.getElementById('redLimit').value);
    sendCommand('Пороги', [0x04, (y >> 8) & 0xFF, y & 0xFF, (r >> 8) & 0xFF, r & 0xFF]);
  };
</script>

</body>
</html>
