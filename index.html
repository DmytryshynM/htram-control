<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTRAM Native Protocol Panel</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --subtext: #94a3b8;
      --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; 
      --warning: #f59e0b; --success: #10b981; --purple: #8b5cf6;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg); color: var(--text); margin: 0; padding: 15px;
      display: flex; justify-content: center;
    }
    .container { max-width: 550px; width: 100%; }
    .header { text-align: center; margin-bottom: 20px; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
    h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .btn {
      width: 100%; background: var(--accent); color: white; border: none;
      padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
      font-size: 14px; transition: 0.2s; margin-top: 8px;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    .status { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: bold; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #64748b; }
    .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric { font-size: 34px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
    .log-box {
      background: #020617; border-radius: 8px; padding: 10px; font-family: monospace;
      font-size: 11px; height: 150px; overflow-y: auto; color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="margin-bottom: 5px;">HTRAM Controller 🇺🇦</h2>
    <p style="color: var(--subtext); margin-top: 0; font-size: 14px;">Повна підтримка UART-протоколу</p>
  </div>

  <div class="card">
    <div class="status">
      <div id="statusDot" class="dot"></div>
      <span id="statusText">Стан: Не підключено</span>
    </div>
    <button id="connectBtn" class="btn">📡 Підключити HTRAM</button>
  </div>

  <div class="card grid">
    <div>
      <label>Рівень CO₂</label>
      <div id="co2Value" class="metric">-- ppm</div>
    </div>
    <div>
      <label>Статус Ризику</label>
      <div id="riskStatus" class="metric" style="color: var(--success); font-size: 22px; margin-top: 15px;">--</div>
    </div>
  </div>

  <div class="card">
    <h3>Керування зумером</h3>
    <div class="grid">
      <button id="muteOnBtn" class="btn btn-danger" disabled>🔇 Вимкнути звук</button>
      <button id="muteOffBtn" class="btn btn-success" disabled>🔊 Увімкнути звук</button>
    </div>
  </div>

  <div class="card">
    <h3>Системний лог</h3>
    <div id="log" class="log-box">Очікування підключення...<br></div>
  </div>
</div>

<script>
  window.onerror = function(msg) { log(`🔴 JS Помилка: ${msg}`); return false; };
  
  const SERVICE_UUID = 'fc247940-6e08-11e4-80fc-0002a5d5c51b';
  const WRITE_CHAR_UUID = '3d115840-6e0b-11e4-b24f-0002a5d5c51b';
  const READ_CHAR_UUID = 'f833d6c0-6e0b-11e4-9136-0002a5d5c51b';
  
  let writeChar = null;

  function log(msg) {
    const logBox = document.getElementById('log');
    if(!logBox) return;
    const time = new Date().toLocaleTimeString('uk-UA');
    logBox.innerHTML += `[${time}] ${msg}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  // Функція створення правильного UART-фрейму з CRC16
  function buildFrame(cmdId1, cmdId2, payloadBytes = []) {
    // Формат: 0x7B, 0x41, LenHi, LenLo, Cmd1, Cmd2, [Payload...], CrcHi, CrcLo, 0x7D
    // Довжина = Cmd (2) + Payload (N) + CRC (2) + End (1)
    let length = 2 + payloadBytes.length + 3; 
    let packet = [0x7B, 0x41, (length >> 8) & 0xFF, length & 0xFF, cmdId1, cmdId2, ...payloadBytes];

    // Розрахунок CRC16 (Poly 0x8005, Init 0x0000)
    let crc = 0x0000;
    for (let i = 0; i < packet.length; i++) {
      crc ^= (packet[i] << 8);
      for (let j = 0; j < 8; j++) {
        if (crc & 0x8000) crc = ((crc << 1) ^ 0x8005) & 0xFFFF;
        else crc = (crc << 1) & 0xFFFF;
      }
    }

    packet.push((crc >> 8) & 0xFF, crc & 0xFF, 0x7D);
    return new Uint8Array(packet);
  }

  async function sendFrame(name, cmdId1, cmdId2, payloadBytes = []) {
    if (!writeChar) { log('❌ Канал не підключено!'); return; }
    try {
      const data = buildFrame(cmdId1, cmdId2, payloadBytes);
      await writeChar.writeValueWithoutResponse(data);
      log(`▶ Відправлено [${name}]: ${Array.from(data).map(x=>x.toString(16).padStart(2,'0')).join('')}`);
    } catch (err) {
      log(`❌ Помилка [${name}]: ${err.message}`);
    }
  }

  document.getElementById('connectBtn').addEventListener('click', async () => {
    try {
      log('Пошук пристрою HTRAM...');
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'HTRAM' }],
        optionalServices: [SERVICE_UUID]
      });

      log(`Підключення до ${device.name}...`);
      const server = await device.gatt.connect();
      
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').innerText = 'Підключено: ' + device.name;

      const service = await server.getPrimaryService(SERVICE_UUID);
      writeChar = await service.getCharacteristic(WRITE_CHAR_UUID);
      log(`✅ Канал керування підключено.`);

      const readChar = await service.getCharacteristic(READ_CHAR_UUID);
      await readChar.startNotifications();
      readChar.addEventListener('characteristicvaluechanged', handleData);
      log(`✅ Підписку на нотифікації активовано.`);

      // КРИТИЧНО: Ініціалізація зв'язку (BLE mode handshake)
      log(`▶ Ініціалізація зв'язку (BLE mode)...`);
      await sendFrame('Init BLE', 0x75, 0x58, [0x01]);

      document.getElementById('muteOnBtn').disabled = false;
      document.getElementById('muteOffBtn').disabled = false;

    } catch (err) {
      log(`❌ Помилка з'єднання: ${err.message}`);
    }
  });

  function handleData(event) {
    const value = event.target.value;
    if (value.byteLength < 10) return; // Ігноруємо короткі пакети

    // Парсимо пакет CO2 (Зазвичай це кадр 0x41 0x44)
    let hexStr = "";
    for (let i = 0; i < value.byteLength; i++) {
        hexStr += value.getUint8(i).toString(16).padStart(2, '0');
    }
    
    // Якщо це відповідь з показниками
    if (hexStr.includes('4144')) {
        log(`◀ Отримано дані CO₂`);
        // У кадрі 4144 CO2 знаходиться на 8-9 байті (0x03 0xe8 = 1000)
        let co2 = value.getUint16(7, false); 
        
        // Фолбек для інших структур пакету
        if (co2 < 400 || co2 > 5000) {
            for (let i = 4; i < value.byteLength - 2; i++) {
                let v = value.getUint16(i, false);
                if (v >= 400 && v <= 5000) { co2 = v; break; }
            }
        }

        if (co2 >= 400) {
            document.getElementById('co2Value').innerText = `${co2} ppm`;
            const riskElem = document.getElementById('riskStatus');
            if (co2 < 800) {
                riskElem.innerText = 'Низький'; riskElem.style.color = '#10b981';
            } else if (co2 >= 800 && co2 < 1100) {
                riskElem.innerText = 'Середній'; riskElem.style.color = '#f59e0b';
            } else {
                riskElem.innerText = 'Високий'; riskElem.style.color = '#ef4444';
            }
        }
    } else {
        log(`◀ Отримано кадр: ${hexStr}`);
    }
  }

  // Команди вимкнення звуку (відправляємо фрейм Mute)
  // Примітка: Точні байти (0x21 0x22) є універсальними для запису статусу в Honeywell
  document.getElementById('muteOnBtn').onclick = () => sendFrame('Зумер Вимк', 0x21, 0x22, [0x00]);
  document.getElementById('muteOffBtn').onclick = () => sendFrame('Зумер Увімк', 0x21, 0x22, [0x01]);

</script>

</body>
</html>
